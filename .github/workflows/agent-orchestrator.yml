name: Autonomous agent team

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One task for Antigravity to plan and implement"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-agent-\${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/agents run '))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install orchestrator clients
        run: python -m pip install --upgrade google-genai openai requests
      - name: Run the two-agent workflow
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_RUN_ID: \${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: \${{ github.run_attempt }}
          TASK_INPUT: \${{ github.event_name == 'workflow_dispatch' && inputs.task || github.event.comment.body }}
          BASE_BRANCH: main
          ANTIGRAVITY_AGENT_ID: \${{ vars.ANTIGRAVITY_AGENT_ID }}
          OPENAI_REVIEW_MODEL: \${{ vars.OPENAI_REVIEW_MODEL }}
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/agent_orchestrator.py
